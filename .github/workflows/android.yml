name: Build AboEzzat Receiver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AboEzzat-Receiver-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Detect signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_INPUT: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS_INPUT" || -z "$KEY_PASSWORD" ]]; then
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "Receiver signing secrets missing or unavailable; debug APK only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release-keystore.jks" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Receiver keystore could not be opened; check the keystore and store password."
            exit 0
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS_INPUT" >> "$GITHUB_ENV"
          echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          echo "Receiver signing configuration detected; secret values are not printed."

      - name: Build signed release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload signed release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: AboEzzat-Receiver-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK to GitHub Release
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.HAS_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: receiver-build-${{ github.run_number }}
          name: Receiver Build ${{ github.run_number }}
          body: "versionCode: ${{ github.run_number }}\nAutomated signed APK build."
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
