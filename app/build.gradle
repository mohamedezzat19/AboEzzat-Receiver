plugins {
    id 'com.android.application'
}

def ciVersionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def ciVersionName = "1.0.${ciVersionCode}"


android {
    namespace 'com.aboezzat.receiver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aboezzat.receiver'
        minSdk 24
        targetSdk 33
        versionCode ciVersionCode
        versionName ciVersionName

        // Android phones, tablets, Android TV and Fire TV use ARM ABIs.
        // Exclude x86/x86_64 emulator-only native libraries from this app.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.9.0'
    implementation 'androidx.media3:media3-ui:1.9.0'
    // LibVLC uses VLC's FFmpeg/avformat demux path for TikTok FLV live streams.
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    // FFmpegKit AAR is assembled in CI from the official 8.1.9 AAR plus
    // the matching armeabi-v7a native libraries for 32-bit Fire TV devices.
    implementation files('libs/ffmpeg-kit-full.aar')
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}
