plugins {
    id 'com.android.application'
}

def ciVersionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def ciVersionName = "1.0.${ciVersionCode}"


android {
    namespace 'com.aboezzat.receiver'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aboezzat.receiver'
        minSdk 23
        targetSdk 33
        versionCode ciVersionCode
        versionName ciVersionName
        // Receiver targets Android phones and TV devices (32-bit and 64-bit ARM).
        // Exclude desktop/emulator ABIs to avoid shipping unused VLC native binaries.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // Compress native VLC libraries in the APK to reduce download size.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.0'
    implementation 'androidx.media3:media3-ui:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // LibVLC engine only; the Receiver UI and media routing remain app-owned.
    implementation 'org.videolan.android:libvlc-all:3.7.7'
}
